name: Build Windrose native runtime

on:
  push:
    branches: [main]
    paths:
      - images/windrose-native/**
      - .github/workflows/build-windrose-native.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/windrose-native
          pull: true
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/kalanur/pterodactyl-windrose-native:latest
            ghcr.io/kalanur/pterodactyl-windrose-native:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
