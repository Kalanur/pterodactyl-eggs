name: Build Windrose native runtime

on:
  push:
    branches: [main]
    paths:
      - images/windrose-native/**
      - .github/workflows/build-windrose-native.yml
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: windrose-native-runtime
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Resolve official Windrose image digest
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          image="docker.io/windroseserver/windroseserver:latest"
          digest="$(docker buildx imagetools inspect "${image}" | awk '/^Digest:/ {print $2; exit}')"
          test -n "${digest}"
          short="${digest#sha256:}"
          short="${short:0:12}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "short=${short}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${image}@${digest}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether scheduled upstream image is already published
        if: github.event_name == 'schedule'
        id: published
        shell: bash
        run: |
          set -euo pipefail
          tag="ghcr.io/kalanur/pterodactyl-windrose-native:upstream-${{ steps.upstream.outputs.short }}"
          if docker buildx imagetools inspect "${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Already published: ${tag}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "New upstream digest detected: ${{ steps.upstream.outputs.digest }}"
          fi
      - name: Build and publish runtime image
        if: github.event_name != 'schedule' || steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/windrose-native
          pull: true
          push: true
          platforms: linux/amd64
          build-args: |
            WINDROSE_UPSTREAM_IMAGE=${{ steps.upstream.outputs.image }}@${{ steps.upstream.outputs.digest }}
            WINDROSE_UPSTREAM_DIGEST=${{ steps.upstream.outputs.digest }}
            WINDROSE_RUNTIME_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/kalanur/pterodactyl-windrose-native:latest
            ghcr.io/kalanur/pterodactyl-windrose-native:${{ github.sha }}
            ghcr.io/kalanur/pterodactyl-windrose-native:upstream-${{ steps.upstream.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.digest=${{ steps.upstream.outputs.digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report unchanged scheduled build
        if: github.event_name == 'schedule' && steps.published.outputs.exists == 'true'
        shell: bash
        run: |
          echo "No build required; upstream digest ${{ steps.upstream.outputs.digest }} is already published." | tee -a "${GITHUB_STEP_SUMMARY}"
